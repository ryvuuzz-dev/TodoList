<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tudu lis</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3">


    <div class="card shadow-sm w-100" style="max-width: 500px;">
        <div class="card-body p-4">
        
            <h3 class="card-title text-center fw-bold mb-4">Daftar Tugas</h3>

            
            <div class="input-group mb-3">
                <input type="text" id="inputTugas" class="form-control" placeholder="Ketikkan tugas baru..." aria-label="Tugas Baru">
                <button id="btnTambah" class="btn btn-primary" type="button">Tambah</button>
            </div>

            
            <div id="areaArray"></div>
        </div>
    </div>


    <script>
        
        let toDoArray = [];

        
        const inputTugas = document.getElementById("inputTugas");
        const btnTambah = document.getElementById("btnTambah");
        const areaArray = document.getElementById("areaArray");

        btnTambah.onclick = function() {
            let nilaiInput = inputTugas.value.trim();

            
            if (nilaiInput === "") {
                alert("tugas tidak boleh kosong");
                return; 
            }

        
            toDoArray.push(nilaiInput);

        
            inputTugas.value = "";

            renderList();
        };

        function renderList() {

            let htmlContent = '<ul class="list-group">';

            for (let i = 0; i < toDoArray.length; i++) {
                htmlContent += `<li class="list-group-item d-flex justify-content-between align-items-center">
                    <span>${i + 1}. ${toDoArray[i]}</span>
                </li>`;
            }


            htmlContent += '</ul>';
            areaArray.innerHTML = htmlContent;
        }
        renderList();
    </script>
</body>
</html>
